<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immobilienangebote — ImmoLux Germany</title>
  <meta name="description" content="Aktuelle Immobilienangebote von ImmoLux Germany in Leipzig und Umgebung.">
  <meta name="theme-color" content="#093418">
  <link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="listings" data-title="meta.listings">
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="shade">
        <img src="assets/img/site/hero-listings.jpg" alt="" width="1584" height="672">
        <div class="grain"></div>
      </div>
      <div class="container">
        <h1 class="display h1 page-hero__title stagger"><span data-i18n="list.title">Aktuelle Immobilien&shy;angebote</span></h1>
      </div>
    </section>

    <div class="container">
      <div class="listings">
        <div class="listings__bar">
          <p class="listings__count" id="count" aria-live="polite"></p>
        </div>
        <div class="cards" id="results"></div>
        <div class="listings__more" id="more"></div>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="cta-band reveal">
          <div class="cta-band__media" aria-hidden="true"><img src="assets/img/site/cta-bg.jpg" alt="" loading="lazy" width="2400" height="1018"></div>
          <h2 data-i18n="cta.title">Nicht das passende Angebot gefunden?</h2>
          <p data-i18n="cta.text"></p>
          <a class="btn btn--primary" href="kontakt.html?subject=search" data-i18n="cta.button">Suchprofil senden</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/properties.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/listings.js"></script>
</body>
</html>
